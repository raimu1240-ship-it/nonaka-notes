<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>店決め投票</title><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* Layout: 1カラム。上から 店カード(タップ順に1-3位) → 送信 → 集計結果。のれんの藍と提灯の朱 */
:root{
  --bg:#f3f4f7; --card:#ffffff; --fg:#1b2333; --muted:#5d667a; --line:#dde1ea;
  --ai:#1f3a68; --ai-soft:#e3e9f4; --shu:#c8432e; --shu-soft:#fbe8e4; --ok:#2f7a4f; --ok-soft:#e1f1e7; --warn:#9a5b00; --warn-soft:#fdf0d8;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --strong:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161f; --card:#1b2130; --fg:#e8ebf2; --muted:#9aa3b6; --line:#2c3446;
  --ai:#8fb0e8; --ai-soft:#22304a; --shu:#ef7a63; --shu-soft:#3a2420; --ok:#6cc596; --ok-soft:#1d3528; --warn:#f0b65a; --warn-soft:#3a2d16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161f; --card:#1b2130; --fg:#e8ebf2; --muted:#9aa3b6; --line:#2c3446;
  --ai:#8fb0e8; --ai-soft:#22304a; --shu:#ef7a63; --shu-soft:#3a2420; --ok:#6cc596; --ok-soft:#1d3528; --warn:#f0b65a; --warn-soft:#3a2d16; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 48px;display:flex;flex-direction:column;gap:28px}
h1{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.3;margin:0;text-wrap:balance;color:var(--ai)}
h2{font-size:17px;margin:0 0 10px;font-weight:700}
.lead{color:var(--muted);margin:6px 0 0}
.rule{background:var(--ai-soft);border-radius:10px;padding:12px 14px;font-size:13.5px}
.rule b{color:var(--ai)}
.stores{display:flex;flex-direction:column;gap:16px}
.store{background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden;transition:border-color .15s,background .15s}
.store.sel{border-color:var(--shu);background:var(--shu-soft)}
.photos{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.photos figure{position:relative;margin:0;min-width:0}
.ribbon{position:absolute;right:10px;top:10px;z-index:2;background:var(--shu);color:#fff;font-family:var(--strong);font-weight:900;font-size:22px;padding:6px 16px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.photos img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover}
.photos figcaption{position:absolute;left:6px;top:6px;font-size:11px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;padding:1px 6px}
@media (max-width:560px){.photos{grid-template-columns:repeat(2,1fr)}}
.sbody{display:flex;gap:12px;align-items:flex-start;padding:12px}
.pick{flex:none;align-self:center;min-width:150px;padding:14px 20px 12px;border-radius:14px;font-family:var(--strong);font-weight:900;font-size:18px;line-height:1.2;
  border:2px solid #142a4f;background:linear-gradient(180deg,#3a5f9e 0%,var(--ai) 100%);color:#fff;cursor:pointer;
  box-shadow:0 5px 0 #0f2140,0 8px 14px rgba(15,33,64,.35);transform:translateY(0);transition:transform .08s,box-shadow .08s,filter .15s;
  -webkit-tap-highlight-color:transparent;position:relative}
.pick::before{content:"タップして選ぶ";display:block;font-family:var(--body);font-size:11px;font-weight:700;letter-spacing:.08em;opacity:.85;margin-bottom:3px}
.pick small{display:block;font-family:var(--body);font-size:11.5px;font-weight:500;margin-top:3px;opacity:.9}
.pick:hover{filter:brightness(1.12)}
.pick:active{transform:translateY(4px);box-shadow:0 1px 0 #0f2140,0 2px 6px rgba(15,33,64,.3)}
.pick[aria-pressed="true"]{background:linear-gradient(180deg,#e06450 0%,var(--shu) 100%);border-color:#8f2a1b;box-shadow:0 5px 0 #8f2a1b,0 8px 14px rgba(143,42,27,.35)}
.pick[aria-pressed="true"]::before{content:"✓ 選択中"}
.pick[aria-pressed="true"]:active{box-shadow:0 1px 0 #8f2a1b}
.pick:disabled{background:var(--line);border-color:var(--line);color:var(--muted);box-shadow:none;cursor:not-allowed;filter:none}
.pick:disabled::before{content:""}
.pick:focus-visible{outline:3px solid var(--shu);outline-offset:3px}
@media (max-width:560px){.sbody{flex-direction:column;align-items:stretch}.pick{width:100%;padding:16px 20px 14px;font-size:20px}}
.howto{margin-bottom:12px;background:var(--ai);color:var(--bg);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.howto .step{font-size:12px;letter-spacing:.14em;font-weight:700;opacity:.8}
.howto strong{font-family:var(--strong);font-weight:900;font-size:22px;line-height:1.35;text-wrap:balance}
.howto p{margin:0;font-size:13.5px;opacity:.9}
.tray{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border:2px solid var(--ai);border-radius:14px;padding:10px 12px;box-shadow:0 6px 18px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:2px dashed var(--line);border-radius:10px;padding:6px 8px;min-width:0;display:flex;align-items:center;gap:6px;min-height:52px}
.slot .rk{flex:none;font-family:var(--strong);font-weight:900;font-size:15px;color:var(--muted)}
.slot .sn{flex:1;min-width:0;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.empty .sn{color:var(--muted);font-weight:400}
.slot.filled{border-style:solid;border-color:var(--shu);background:var(--shu-soft)}
.slot.filled .rk{color:var(--shu)}
.slot.next{border-color:var(--ai);border-style:solid;background:var(--ai-soft)}
.slot.next .rk{color:var(--ai)}
.slot .x{flex:none;border:none;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;padding:0 2px;line-height:1}
.trayfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.nextmsg{font-weight:700;font-size:14px;color:var(--ai)}
.nextmsg.done{color:var(--ok)}
.linkbtn{font:inherit;font-size:12.5px;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer}
@media (max-width:560px){.slot{flex-direction:column;align-items:flex-start;gap:0}.slot .sn{white-space:normal;font-size:12px}}
.smoke{margin-top:6px;font-size:13px}
.seat{font-size:13px;color:var(--muted);margin-top:2px}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;margin-right:4px}
.sm-paper{background:var(--ok-soft);color:var(--ok)}
.sm-ecig{background:var(--warn-soft);color:var(--warn)}
.sm-sep{background:var(--ai-soft);color:var(--ai)}
.sm-none{background:var(--line);color:var(--muted)}
.info{min-width:0;flex:1}
.name{font-weight:700;font-size:16px}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.meta .rt{color:var(--shu);font-weight:700;font-variant-numeric:tabular-nums}
.info a{font-size:12.5px;color:var(--ai)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text]{font:inherit;padding:10px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);flex:1;min-width:0}
textarea{font:inherit;font-size:13px;width:100%;min-height:90px;padding:10px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--fg)}
button.btn{font:inherit;font-weight:900;font-size:16px;padding:12px 22px;border-radius:12px;border:2px solid #142a4f;background:linear-gradient(180deg,#3a5f9e 0%,var(--ai) 100%);color:#fff;cursor:pointer;box-shadow:0 4px 0 #0f2140;transition:transform .08s,box-shadow .08s}
button.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0f2140}
button.btn.sub{background:transparent;color:var(--ai);border:1.5px solid var(--ai)}
button.btn:disabled{background:var(--line);border-color:var(--line);color:var(--muted);box-shadow:none;cursor:not-allowed;opacity:1}
button.btn:focus-visible{outline:3px solid var(--shu);outline-offset:2px}
.msg{font-size:13.5px;min-height:1.2em}
.msg.ok{color:var(--ok)} .msg.err{color:var(--shu)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:10px;word-break:break-all;user-select:all}
.winner{background:var(--card);border:2px solid var(--shu);border-radius:14px;padding:16px}
.winner .lbl{font-size:12px;letter-spacing:.12em;color:var(--shu);font-weight:700}
.winner .wn{font-family:var(--display);font-size:24px;margin:4px 0}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:nth-child(2),td:nth-child(2){text-align:left;white-space:normal}
th{color:var(--muted);font-weight:500;font-size:12px}
tr.top td{font-weight:700}
.voters{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12.5px;background:var(--ai-soft);color:var(--ai);border-radius:999px;padding:3px 10px}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
summary{cursor:pointer;font-weight:700;font-size:14px}
details>div{margin-top:10px;display:flex;flex-direction:column;gap:10px}
.small{font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,14,24,.55);display:grid;place-items:center;padding:16px}
.ovbox{background:var(--card);color:var(--fg);border-radius:16px;padding:28px 32px;min-width:240px;max-width:90vw;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;gap:14px}
.ovtext{font-family:var(--strong);font-weight:900;font-size:20px}
.ovsub{font-size:13px;color:var(--muted)}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid var(--ai-soft);border-top-color:var(--ai);animation:sp 0.9s linear infinite}
.check{width:52px;height:52px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:900}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
</style>
</head><body>

<div class="wrap">
  <header>
    <h1>店決め投票</h1>
    <p class="lead">行きたい順にお店を決めます。</p>
  </header>


  <section>
    <div class="howto">
      <span class="step">STEP 1</span>
      <strong>行きたい順に、お店のボタンを3回押す</strong>
      <p>1回目に押した店が1位、2回目が2位、3回目が3位。選んだ店は下の枠に入る。</p>
    </div>
    <div class="tray" id="tray" aria-live="polite">
      <div class="slots" id="slots"></div>
      <div class="trayfoot"><span class="nextmsg" id="next-msg"></span><button type="button" class="linkbtn" id="reset-btn">選び直す</button></div>
    </div>
    <div class="stores" id="stores"></div>
  </section>

  <section>
    <h2 id="step2">STEP 2　名前を入れて投票する</h2>
    <div class="row">
      <input type="text" id="voter-name" maxlength="12" placeholder="例: のなか" autocomplete="off">
      <button class="btn" id="submit-btn" disabled>投票する</button>
    </div>
    <p class="msg" id="submit-msg"></p>
  </section>


</div>

<div class="overlay" id="overlay" hidden role="dialog" aria-modal="true" aria-live="assertive">
  <div class="ovbox"><div id="ov-icon" class="spin"></div><div class="ovtext" id="ov-text">送信中…</div><div class="ovsub" id="ov-sub">画面を閉じずに待つ</div></div>
</div>

      const im=document.createElement("img"); im.src=p.src; im.alt=s.name+"の"+p.label+"写真"; im.loading="lazy"; im.width=440; im.height=330;
      const cap=document.createElement("figcaption"); cap.textContent=p.label;
      f.append(im,cap); strip.append(f);
    }
    if(i>=0){ const rb=document.createElement("div"); rb.className="ribbon"; rb.textContent=(i+1)+"位"; strip.append(rb); }
    const body=document.createElement("div"); body.className="sbody";
    const info=document.createElement("div"); info.className="info";
    const nm=document.createElement("div"); nm.className="name"; nm.textContent=s.name;
    const mt=document.createElement("div"); mt.className="meta";
    const rt=document.createElement("span"); rt.className="rt"; rt.textContent="★"+s.rating.toFixed(2);
    mt.append(rt," ・ "+s.genre+" ・ "+s.area+" ・ 夜 "+s.budget);
    const sm=document.createElement("div"); sm.className="smoke";
    const pill=document.createElement("span"); pill.className="pill "+SMOKE[s.smoke].cls; pill.textContent=SMOKE[s.smoke].label;
    sm.append(pill," "+s.smokeNote);
    const st=document.createElement("div"); st.className="seat"; st.textContent="席: "+s.seat;
    const a=document.createElement("a"); a.href=s.url; a.target="_blank"; a.rel="noopener"; a.textContent="食べログで見る";
    info.append(nm,mt,sm,st,a);
    const b=document.createElement("button");
    b.type="button"; b.className="pick"; b.id="store-"+s.id;
    b.setAttribute("aria-pressed",i>=0?"true":"false");
    const n=picks.length+1;
    if(i>=0){ b.innerHTML=(i+1)+"位に選択中<small>押すと取り消し</small>"; }
    else if(picks.length<3){ b.innerHTML=n+"位にする<small>"+(n===1?"いちばん行きたい":n===2?"2番目に行きたい":"3番目に行きたい")+"</small>"; }
    else { b.innerHTML="3店 選択済み<small>変えるなら上の×で外す</small>"; b.disabled=true; }
    b.setAttribute("aria-label",s.name+"："+b.textContent);
    b.addEventListener("click",()=>{
      if(i>=0) picks.splice(i,1); else if(picks.length<3) picks.push(s.id);
      renderStores(); updateSubmit();
    });
    body.append(info,b); card.append(strip,body); box.append(card);
  }
  renderTray();
}
function renderTray(){
  const box=$("slots"); box.textContent="";
  for(let r=0;r<3;r++){
    const sid=picks[r]; const st=STORES.find(x=>x.id===sid);
    const d=document.createElement("div");
    d.className="slot "+(st?"filled":(r===picks.length?"next":"empty"));
    const rk=document.createElement("span"); rk.className="rk"; rk.textContent=(r+1)+"位";
    const sn=document.createElement("span"); sn.className="sn"; sn.textContent=st?st.name:(r===picks.length?"← 次はここ":"未選択");
    d.append(rk,sn);
    if(st){ const x=document.createElement("button"); x.type="button"; x.className="x"; x.textContent="×"; x.setAttribute("aria-label",(r+1)+"位の"+st.name+"を外す");
      x.addEventListener("click",()=>{ picks.splice(r,1); renderStores(); updateSubmit(); }); d.append(x); }
    box.append(d);
  }
  const m=$("next-msg");
  if(picks.length===3){ m.className="nextmsg done"; m.textContent="3店そろった。下の STEP 2 で投票する ↓"; }
  else { m.className="nextmsg"; m.textContent=["いちばん行きたい店の「1位にする」を押す","次は「2位にする」を押す","最後に「3位にする」を押す"][picks.length]; }
  $("reset-btn").hidden=picks.length===0;
}
function updateSubmit(){
  const left=3-picks.length, hasName=$("voter-name").value.trim().length>0;
  const b=$("submit-btn");
  b.disabled=sent || left>0 || !hasName;
  b.textContent= left>0 ? "あと"+left+"店選んでね" : (!hasName ? "名前を入れてね" : "投票する");
}

function cleanName(n){return n.replace(/[\n\r]/g,"").trim().slice(0,20)}
function showOverlay(state,text,sub){
  const ov=$("overlay"), ic=$("ov-icon");
  ic.className=state==="done"?"check":"spin"; ic.textContent=state==="done"?"✓":"";
  $("ov-text").textContent=text; $("ov-sub").textContent=sub||"";
  ov.hidden=false;
}
function resetAll(){
  picks=[]; $("voter-name").value=""; $("submit-msg").textContent=""; $("submit-msg").className="msg";
  renderStores(); updateSubmit(); window.scrollTo({top:0,behavior:"smooth"});
}
function submitVote(){
  const name=cleanName($("voter-name").value); const ranks=picks.slice(); const msg=$("submit-msg");
  if(!name||ranks.length!==3||new Set(ranks).size!==3){ updateSubmit(); return; }
  sent=true; updateSubmit(); msg.textContent="";
  showOverlay("sending","送信中…","画面を閉じずに待つ");
  const FORM="https://docs.google.com/forms/d/e/1FAIpQLSd-i7fEBhU0wj5hVw3LZGiVgjSpaAUWS8RVvyad-8MVXusJEA/formResponse";
  const nm=r=>STORES.find(x=>x.id===r).name;
  const body=new URLSearchParams();
  body.append("entry.2104741654",name);
  body.append("entry.689254103",nm(ranks[0]));
  body.append("entry.598203988",nm(ranks[1]));
  body.append("entry.1007030845",nm(ranks[2]));
  fetch(FORM,{method:"POST",mode:"no-cors",body})
    .then(()=>{
      showOverlay("done","送信完了","投票ありがとう！");
      setTimeout(()=>{ $("overlay").hidden=true; sent=false; resetAll(); },1800);
    })
    .catch(()=>{
      $("overlay").hidden=true; sent=false; updateSubmit();
      msg.className="msg err"; msg.textContent="送信できなかった。電波を確認してもう一度押す。";
    });
}

$("voter-name").addEventListener("input",updateSubmit);
$("submit-btn").addEventListener("click",submitVote);
$("reset-btn").addEventListener("click",()=>{ picks=[]; renderStores(); updateSubmit(); });
renderStores(); updateSubmit();
</script>
</body></html>
